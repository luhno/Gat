# Render Blueprint — opção grátis para subir o modo online (1 sala por deploy).
# Passo a passo: docs/ONLINE_DEPLOY.md
#
# Render → New → Blueprint → conecte o repositório deste projeto.
# O serviço é Docker (Dockerfile na raiz) e o Render injeta PORT + HTTPS na borda.
services:
  - type: web
    name: gather-offline
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ROOM_NAME
        value: Escritório online
      # STUN/TURN: sem ICE_SERVERS o app usa stun:stun.l.google.com:19302 (definido no código).
      # Para redes restritivas, adicione ICE_SERVERS no painel do Render (Environment) com um
      # TURN grátis (Metered Open Relay, Cloudflare Calls TURN ou coturn numa VM):
      #   [{"urls":"turn:...:443","username":"...","credential":"..."}]
